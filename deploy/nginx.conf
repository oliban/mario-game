server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ES modules must arrive as JavaScript or the browser refuses to execute them.
    types {
        text/html                 html;
        text/javascript           js mjs;
        text/css                  css;
        application/json          json;
        image/png                 png;
        image/svg+xml             svg;
        image/x-icon              ico;
    }
    default_type application/octet-stream;

    gzip on;
    gzip_types text/html text/javascript text/css application/json image/svg+xml;
    gzip_min_length 1024;

    # The art modules are large string-literal files and change on every art pass,
    # so they are revalidated rather than cached hard.
    location ~* \.(js|mjs)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
